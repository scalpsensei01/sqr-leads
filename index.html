      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background: rgba(15,23,42,.55);
        backdrop-filter: blur(2px) saturate(90%);
        -webkit-backdrop-filter: blur(2px) saturate(90%);
        pointer-events: none;
      }

      .app-header {
        background: #fff;
        padding: 0;
        text-align: center;
        position: relative;
        top: 0;
        z-index: 100;
        border-bottom: none;
        box-shadow: none;
      }
      .app-header img {
        display: block;
        margin: 0;
        width: 100%;
        height: auto;
        max-height: none;
        object-fit: cover;
      }

      .nav-bar {
        display: flex;
        gap: .5rem;
        padding: .75rem 1rem;
        background: transparent;
        border-bottom: none;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .nav-bar::-webkit-scrollbar { display: none; }
      .qr-btn { flex: 0 0 auto; min-width: 60px; }
      .qr-btn .icon { font-size: 1.2rem; }
      .qr-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15,23,42,.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 500;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 2rem;
      }
      .qr-overlay.active { display: flex; }
      .qr-box {
        background: #fff;
        border-radius: 1rem;
        padding: 2rem;
        max-width: 90vw;
        max-height: 80vh;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,.4);
      }
      .qr-box img { max-width: 100%; max-height: 60vh; display: block; margin: 0 auto; }
      .qr-box p { margin-top: 1rem; color: var(--primary); font-weight: 700; font-size: 1.1rem; }
      .qr-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: rgba(255,255,255,.15);
        border: 1px solid rgba(255,255,255,.25);
        color: #fff;
        border-radius: 50%;
        width: 44px;
        height: 44px;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .nav-btn {
        flex: 1;
        min-width: 110px;
        padding: .65rem .5rem;
        border: 1px solid rgba(255,255,255,.2);

  <body>
    <div id="root"></div>

    <script>
      // ===========================================================
      // CONFIG (edit before deploying)
      // 1. Create a Telegram group, add your bot
      // 2. Send a message in the group
      // 3. Visit:
      //    https://api.telegram.org/bot8635151627:AAHvCy0vAMQJKuIsRIQKwAvhcZhT2BrAIXs/getUpdates
      // 4. Find "chat":{"id":-100XXXXXXXXXX... copy that id into TELEGRAM_CHAT_ID below
      // ===========================================================
      const CONFIG = {
        TELEGRAM_BOT_TOKEN: '8635151627:AAHvCy0vAMQJKuIsRIQKwAvhcZhT2BrAIXs',
        TELEGRAM_CHAT_ID: '-1003716881293',
        RATE_PER_SQFT: 1.65,
        MAX_LEADS: 500,
        SCHEMA_VERSION: 4,
      };

      // ===========================================================
      // STATE
      // ===========================================================
      let currentPage = 'capture';
      let currentLeadId = null;
      let formDirty = false;

      function getLeads() {
        try {
          const raw = localStorage.getItem('sqr_leads') || '[]';
          let leads = JSON.parse(raw);
          if (!Array.isArray(leads)) leads = [];
          leads = leads.map(migrateLead).filter(Boolean);
          return leads.slice(0, CONFIG.MAX_LEADS);
        } catch (e) {
          console.error('Failed to load leads', e);
          return [];
        }
      }
      function saveLeads(leads) {
        const trimmed = leads.slice(0, CONFIG.MAX_LEADS);
        localStorage.setItem('sqr_leads', JSON.stringify(trimmed));
        updateBadge();
      }
      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      }
      function getNextPoNumber() {
        let next = parseInt(localStorage.getItem('sqr_next_po') || '1', 10);
        if (isNaN(next) || next < 1) next = 1;
        localStorage.setItem('sqr_next_po', String(next + 1));
        return next;
      }

      // ===========================================================
      // SCHEMA / MIGRATION
      // ===========================================================
      function migrateLead(lead) {
        if (!lead || typeof lead !== 'object') return null;
        if (!lead._schemaVersion) {
          lead._schemaVersion = CONFIG.SCHEMA_VERSION;
          if (lead.quote && typeof lead.quote === 'number') {
            lead.quote = {
              rate: CONFIG.RATE_PER_SQFT,
              sqft: lead.sqft || 0,
              total: lead.quote,
              computedAt: new Date().toISOString(),
            };
          }
        }
        if (lead._schemaVersion < 4) {
          lead._schemaVersion = CONFIG.SCHEMA_VERSION;
          
        }
        lead.id = lead.id || generateId();
        lead.status = lead.status || 'New';
        lead.createdAt = lead.createdAt || new Date().toISOString();
        return lead;
      }

      // ===========================================================
      // VALIDATION
      // ===========================================================
      function validatePhone(phone) {
        const digits = phone.replace(/\D/g, '');
        return digits.length >= 10;
      }
      function validateZip(zip) {
        return /^\d{5}(-\d{4})?$/.test(zip.trim());
      }
      function normalizePhone(phone) {
        const digits = phone.replace(/\D/g, '');
        if (digits.length === 10) {
          return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
        }
        return phone;
      }
      function isDuplicatePhone(phone, excludeId) {
        const digits = phone.replace(/\D/g, '');
        return getLeads().some(l => l.id !== excludeId && l.phone.replace(/\D/g, '') === digits);
      }

      // ===========================================================
      // TELEGRAM
      // ===========================================================
      async function sendTelegram(text) {
        if (!CONFIG.TELEGRAM_BOT_TOKEN || !CONFIG.TELEGRAM_CHAT_ID) {
          showToast('Telegram not configured — set TELEGRAM_CHAT_ID');
          return false;
        }
        const url = `https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendMessage`;
        const body = new URLSearchParams({ chat_id: CONFIG.TELEGRAM_CHAT_ID, text, parse_mode: 'HTML' });
        try {
          const r = await fetch(url, { method: 'POST', body });
          if (!r.ok) throw new Error('Telegram HTTP ' + r.status);
          showToast('Sent to Telegram');
          return true;
        } catch(e) {
          showToast('Telegram send failed — check chat ID');
          console.error(e);
          return false;
        }
      }

      function buildTelegramMessage(lead, includeQuote) {
        const sep = '━'.repeat(21);
        const poStr = lead.poNumber ? String(lead.poNumber).padStart(5, '0') : '00000';
        const dt = new Date(lead.createdAt).toLocaleString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'
        }) + ' ET';
        const fullAddress = `${lead.address}, ${lead.city}, ${lead.state} ${lead.zip}`;

        let msg = `🏠 New Roof Inspection Request\n📋 PO#: ${poStr}\n${sep}\n👷 Worker: ${lead.worker || 'N/A'}\n👤 Name: ${lead.name}\n📞 Phone: ${lead.phone.replace(/\\D/g, '')}\n📧 Email: ${lead.email || 'N/A'}\n📍 Address: ${fullAddress}\n`;
        if (lead.roofType) msg += `🏗️ Roof Type: ${lead.roofType}\n`;
        if (lead.urgency) msg += `⏰ Urgency: ${lead.urgency}\n`;
        if (lead.source) msg += `📎 Source: ${lead.source}\n`;
        msg += `💬 Message: ${lead.notes || 'N/A'}\n${sep}\n🕐 ${dt}`;

        if (includeQuote && lead.quote) {
          const q = lead.quote;
          const originalTotal = roundCurrency(q.sqft * q.rate);
          const discountAmount = roundCurrency(originalTotal - q.total);
          msg += `\n\n💰 Quote Details\n━━━━━━━━━━━━━━━━━━━━━\nRoof Size: ${q.sqft} sq ft\nRate: $${q.rate}/sq ft\nOriginal Price: $${Number(originalTotal).toLocaleString('en-US', {minimumFractionDigits:2})}`;
          if (q.discount) {
            msg += `\nDiscount: ${Math.round(q.discount * 100)}% off (-$${Number(discountAmount).toLocaleString('en-US', {minimumFractionDigits:2})})`;
          }
          msg += `\n━━━━━━━━━━━━━━━━━━━━━\nFinal Price: $${Number(q.total).toLocaleString('en-US', {minimumFractionDigits:2})}`;
        }
        return msg;
      }

      async function sendLeadToTelegram(leadId) {
        const lead = getLeads().find(l => l.id === leadId);
        if (!lead) { showToast('Lead not found'); return false; }
        const hasQuote = !!(lead.quote && lead.quote.total);
        const text = buildTelegramMessage(lead, hasQuote);
        return await sendTelegram(text);
      }

      // ===========================================================
      // EXPORT / BACKUP
      // ===========================================================
      function exportJSON() {
        const leads = getLeads();
        const blob = new Blob([JSON.stringify(leads, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sqr-leads-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Exported JSON backup');
      }
      function exportCSV() {
        const leads = getLeads();
        if (leads.length === 0) { showToast('No leads to export'); return; }
        const headers = ['PO#','Worker','Name','Phone','Email','Address','City','State','ZIP','RoofType','Urgency','Source','Status','SqFt','QuoteTotal','Discount','Notes','CreatedAt'];
        const rows = leads.map(l => [
          l.poNumber || '', (l.worker || ''), l.name, l.phone, l.email, l.address, l.city, l.state, l.zip,
          l.roofType, l.urgency, l.source, l.status,
          (l.sqft || ''), ((l.quote && l.quote.total) || ''), (l.quote && l.quote.discount ? Math.round(l.quote.discount * 100) / 100 : ''),
          (l.notes || '').replace(/"/g, '""'), l.createdAt
        ].map(v => `"${String(v).replace(/"/g, '""')}"`));
        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sqr-leads-${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Exported CSV');
      }

      // ===========================================================
      // UI HELPERS
      // ===========================================================
      function showToast(msg) {
        let t = document.querySelector('.toast');
        if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); document.body.appendChild(t); }
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
      }
      function formatCurrency(n) {
        return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      function formatDate(d) {
        return new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      }
      function esc(s) {
        const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
      }
      function roundCurrency(n) {
        return Math.round(n * 100) / 100;
      }

      // ===========================================================
      // CLIPBOARD
      // ===========================================================
      async function copyToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          showToast('Copied to clipboard');
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            showToast('Copied to clipboard');
          } catch (e) {
            showToast('Copy failed — please copy manually');
          }
          document.body.removeChild(ta);
        }
      }

      // ===========================================================
      // ROUTING
      // ===========================================================
      function showPage(name, leadId) {
        currentPage = name;
        currentLeadId = leadId || null;
        document.querySelectorAll('.page').forEach(p => {
          p.classList.remove('active');
          p.setAttribute('aria-hidden', 'true');
        });
        const el = document.getElementById('page-' + name);
        if (el) {
          el.classList.add('active');
          el.setAttribute('aria-hidden', 'false');
        }
        document.querySelectorAll('.nav-btn').forEach(b => {
          const active = b.dataset.page === name;
          b.classList.toggle('active', active);
          b.setAttribute('aria-current', active ? 'page' : 'false');
        });
        window.scrollTo(0, 0);
        if (name === 'detail' && leadId) renderDetail(leadId);
        if (name === 'dashboard') renderDashboard();
      }

      // ===========================================================
      // EVENT HANDLERS
      // ===========================================================
      function onSaveLead(e) {
        e.preventDefault();
        const f = e.target;
        const rawPhone = f.phone.value.trim();
        const rawZip = f.zip.value.trim();

        if (!validatePhone(rawPhone)) {
          showToast('Enter a valid 10-digit phone number');
          f.phone.focus();
          return;
        }
        if (!validateZip(rawZip)) {
          showToast('Enter a valid 5-digit ZIP code');
          f.zip.focus();
          return;
        }
        if (isDuplicatePhone(rawPhone)) {
          if (!confirm('A lead with this phone number already exists. Save anyway?')) {
            return;
          }
        }

        const lead = {
          _schemaVersion: CONFIG.SCHEMA_VERSION,
          id: generateId(),
          poNumber: getNextPoNumber(),
          worker: f.worker.value.trim(),
          name: f.name.value.trim(),
          phone: normalizePhone(rawPhone),
          email: f.email.value.trim(),
          address: f.address.value.trim(),
          city: f.city.value.trim(),
          state: f.state.value.trim(),
          zip: rawZip,
          notes: f.notes.value.trim(),
          source: f.source.value,
          roofType: f.roofType.value,
          urgency: f.urgency.value,
          sqft: '',
          quote: null,
          status: 'New',
          createdAt: new Date().toISOString(),
        };
        const leads = getLeads();
        leads.unshift(lead);
        saveLeads(leads);
        formDirty = false;

        renderSuccess(lead);
        showPage('success');
        f.reset();
      }

      function renderSuccess(lead) {
        document.getElementById('succ-name').textContent = lead.name;
      }

      function onCopyAddress() {
        const lead = getLeads().find(l => l.id === currentLeadId);
        if (!lead) return;
        const fullAddress = `${lead.address}, ${lead.city}, ${lead.state} ${lead.zip}`;
        copyToClipboard(fullAddress);
      }

      function onSendToTelegram() {
        sendLeadToTelegram(currentLeadId);
      }

      function onUpdateStatus(status) {
        const leads = getLeads();
        const idx = leads.findIndex(l => l.id === currentLeadId);
        if (idx === -1) return;
        leads[idx].status = status;
        saveLeads(leads);
        showToast(`Status: ${status}`);
        renderDetail(currentLeadId);
      }

      function onCopyQuote() {
        const lead = getLeads().find(l => l.id === currentLeadId);
        if (!lead || !lead.quote) { showToast('No quote'); return; }
        const q = lead.quote;
        const originalTotal = roundCurrency(q.sqft * q.rate);
        const discountAmount = roundCurrency(originalTotal - q.total);
        let text = `Roof Renewal Estimate for ${lead.name}\n${lead.address}, ${lead.city} ${lead.state}\nRoof size: ${lead.sqft} sq ft\nRate: ${formatCurrency(q.rate)}/sq ft\nOriginal Price: ${formatCurrency(originalTotal)}`;
        if (q.discount) {
          text += `\nDiscount: ${Math.round(q.discount * 100)}% off (-${formatCurrency(discountAmount)})`;
        }
        text += `\nFinal Price: ${formatCurrency(q.total)}`;
        copyToClipboard(text);
      }

      // ===========================================================
      // ROOF CALCULATOR
      // ===========================================================
      let currentPitch = 1.15;

      function setCalcMode(mode) {
        const elDims = document.getElementById('calc-dims');
        const elLiving = document.getElementById('calc-living');
        const elRoofSqt = document.getElementById('calc-roofsqt');
        const elCommon = document.getElementById('calc-common');
        const elResult = document.getElementById('calc-result');
        const elModeDims = document.getElementById('mode-dims');
        const elModeLiving = document.getElementById('mode-living');
        const elModeRoofSqt = document.getElementById('mode-roofsqt');
        if (elDims) elDims.style.display = mode === 'dims' ? 'block' : 'none';
        if (elLiving) elLiving.style.display = mode === 'living' ? 'block' : 'none';
        if (elRoofSqt) elRoofSqt.style.display = mode === 'roofsqt' ? 'block' : 'none';
        if (elCommon) elCommon.style.display = mode === 'roofsqt' ? 'none' : 'block';
        if (elResult) elResult.style.display = 'none';
        if (elModeDims) elModeDims.classList.toggle('active', mode === 'dims');
        if (elModeLiving) elModeLiving.classList.toggle('active', mode === 'living');
        if (elModeRoofSqt) elModeRoofSqt.classList.toggle('active', mode === 'roofsqt');
      }

      function selectPitch(btn) {
        document.querySelectorAll('.pitch-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPitch = parseFloat(btn.dataset.pitch);
      }

      let currentDiscount = 0;

      function selectDiscount(discount, btn) {
        currentDiscount = discount;
        document.querySelectorAll('.discount-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
      }

      function calculateRoof() {
        let roofSqft = 0;
        const elDims = document.getElementById('calc-dims');
        const elRoofSqt = document.getElementById('calc-roofsqt');
        let mode = 'living';
        if (elDims && elDims.style.display !== 'none') mode = 'dims';
        else if (elRoofSqt && elRoofSqt.style.display !== 'none') mode = 'roofsqt';

        if (mode === 'dims') {
          const length = parseFloat(document.getElementById('calc-length').value);
          const width = parseFloat(document.getElementById('calc-width').value);
          if (!length || !width || length <= 0 || width <= 0) {
            showToast('Enter house length and width');
            return;
          }
          const footprint = length * width;
          const garageSqft = parseFloat(document.getElementById('calc-garage').value);
          const overhangFactor = parseFloat(document.getElementById('calc-overhang').value);
          roofSqft = Math.round((footprint + garageSqft) * currentPitch * overhangFactor);
        } else if (mode === 'living') {
          const livingSqft = parseFloat(document.getElementById('calc-living-sqft').value);
          const stories = parseInt(document.getElementById('calc-stories').value);
          if (!livingSqft || livingSqft <= 0) {
            showToast('Enter living area square footage');
            return;
          }
          const footprint = livingSqft / stories;
          const garageSqft = parseFloat(document.getElementById('calc-garage').value);
          const overhangFactor = parseFloat(document.getElementById('calc-overhang').value);
          roofSqft = Math.round((footprint + garageSqft) * currentPitch * overhangFactor);
        } else if (mode === 'roofsqt') {
          roofSqft = parseFloat(document.getElementById('calc-roof-sqft').value);
          if (!roofSqft || roofSqft <= 0) {
            showToast('Enter roof square footage');
            return;
          }
        }

        let totalCost = roundCurrency(roofSqft * CONFIG.RATE_PER_SQFT);
        let discountAmount = 0;
        if (currentDiscount > 0) {
          discountAmount = roundCurrency(totalCost * currentDiscount);
          totalCost = roundCurrency(totalCost - discountAmount);
        }

        let discountHtml = '';
        let originalHtml = '';
        const originalCost = roundCurrency(roofSqft * CONFIG.RATE_PER_SQFT);
        if (currentDiscount > 0) {
          discountHtml = `\u003cdiv class="label" style="margin-top:.5rem;"\u003eDiscount: ${Math.round(currentDiscount * 100)}% off (-${formatCurrency(discountAmount)})\u003c/div\u003e`;
          originalHtml = `\u003cdiv class="label" style="margin-top:.5rem;"\u003eOriginal Price: ${formatCurrency(originalCost)}\u003c/div\u003e`;
        }

        const resultEl = document.getElementById('calc-result');
        resultEl.style.display = 'block';
        resultEl.innerHTML = `
          \u003cdiv class="quote-result"\u003e
            \u003cdiv class="label"\u003eEstimated Roof Size\u003c/div\u003e
            \u003cdiv class="big-number" style="font-size:2.5rem;"\u003e${roofSqft.toLocaleString()} sq ft\u003c/div\u003e
            \u003cdiv style="margin-top:.5rem;font-size:.9rem;color:var(--text-light);"\u003eRate: ${formatCurrency(CONFIG.RATE_PER_SQFT)}/sq ft\u003c/div\u003e
            ${originalHtml}
            ${discountHtml}
            \u003cdiv class="label" style="margin-top:1rem;"\u003eFinal Price\u003c/div\u003e
            \u003cdiv class="big-number"\u003e${formatCurrency(totalCost)}\u003c/div\u003e
          \u003c/div\u003e
          \u003cdiv class="action-btns"\u003e
            \u003cbutton class="btn btn-primary" onclick="saveCalculatedQuote(${roofSqft}, ${totalCost}, ${currentDiscount})"\u003e💾 Save to Lead & Send Telegram\u003c/button\u003e
            \u003cbutton class="btn btn-secondary" onclick="document.getElementById('calc-result').style.display='none';"\u003e↩️ Recalculate\u003c/button\u003e
          \u003c/div\u003e
        `;
      }

      function saveCalculatedQuote(sqft, quoteTotal, discount) {
        const leads = getLeads();
        const idx = leads.findIndex(l => l.id === currentLeadId);
        if (idx === -1) return;
        leads[idx].sqft = sqft;
        leads[idx].quote = {
          rate: CONFIG.RATE_PER_SQFT,
          sqft: sqft,
          total: quoteTotal,
          discount: discount || 0,
          computedAt: new Date().toISOString(),
        };
        saveLeads(leads);
        showToast('Quote saved');
        // Auto-send to Telegram after quote is saved
        sendLeadToTelegram(currentLeadId);
        renderDetail(currentLeadId);
      }

      // ===========================================================
      // RENDERERS
      // ===========================================================
      function updateBadge() {
        const count = getLeads().length;
        const badge = document.getElementById('badge-count');
        if (badge) badge.textContent = count;
      }

      function renderDashboard() {
        const list = document.getElementById('lead-list');
        const term = document.getElementById('lead-search')?.value?.toLowerCase() || '';
        const leads = getLeads().filter(l =>
          (l.name || '').toLowerCase().includes(term) ||
          (l.phone || '').includes(term) ||
          (l.address || '').toLowerCase().includes(term)
        );

        if (leads.length === 0) {
          list.innerHTML = `<div class="card" style="text-align:center;color:var(--text-light);">No leads yet. Tap "Capture" to add one.</div>`;
          return;
        }

        list.innerHTML = leads.map(l => {
          const statusClass = 'status-' + (l.status || 'New').toLowerCase().replace(/\s+/g, '');
          const poStr = l.poNumber ? String(l.poNumber).padStart(5, '0') : '00000';
          const quoteText = (l.quote && l.quote.total) ? formatCurrency(l.quote.total) : '';
          return `<div class="lead-card" onclick="showPage('detail','${l.id}')">
            <div class="name">${esc(l.name)}</div>
            <div class="meta">#${poStr} · ${esc(l.address)} · ${esc(l.phone)}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem;">
              <span class="status-badge ${statusClass}">${esc(l.status || 'New')}</span>
              <span class="amount">${quoteText}</span>
            </div>
          </div>`;
        }).join('');
      }

          <main id="main-content">
            <!-- PAGE: CAPTURE -->
            <div id="page-capture" class="page active" aria-hidden="false">
              <form id="lead-form" onsubmit="onSaveLead(event)">
                <div class="card">
                  <div class="card-title">📝 Lead Capture</div>
                  <div class="form-group"><label for="lead-worker">Worker Name</label><input type="text" id="lead-worker" name="worker" placeholder="Your name"></div>
                  <div class="form-group"><label for="lead-name">Full Name</label><input type="text" id="lead-name" name="name" placeholder="John Smith" required></div>
                  <div class="form-row">
                    <div class="form-group"><label for="lead-phone">Phone</label><input type="tel" id="lead-phone" name="phone" placeholder="(954) 555-1234" required></div>
                    <div class="form-group"><label for="lead-email">Email</label><input type="email" id="lead-email" name="email" placeholder="john@email.com"></div>
                  </div>
                  <div class="form-group"><label for="lead-address">Street Address</label><input type="text" id="lead-address" name="address" placeholder="123 Main St" required></div>
                  <div class="form-row">
                    <div class="form-group"><label for="lead-city">City</label><input type="text" id="lead-city" name="city" placeholder="Fort Lauderdale" required></div>
                    <div class="form-group"><label for="lead-state">State</label><input type="text" id="lead-state" name="state" value="FL" required></div>
                    <div class="form-group"><label for="lead-zip">ZIP</label><input type="text" id="lead-zip" name="zip" placeholder="33073" required></div>
                  </div>
                  <div class="form-row">
                    <div class="form-group"><label for="lead-roof">Roof Type</label>
                      <select id="lead-roof" name="roofType">
                        <option value="Shingle">Shingle</option>
                        <option value="Tile">Tile</option>
                        <option value="Metal">Metal</option>
                        <option value="Unknown">Unknown</option>
                      </select>
                    </div>
                    <div class="form-group"><label for="lead-urgency">Urgency</label>
                      <select id="lead-urgency" name="urgency">
                        <option value="Ready now">Ready now</option>
                        <option value="30 days">30 days</option>
                        <option value="3 months">3 months</option>
                        <option value="Just researching">Just researching</option>
                      </select>
                    </div>
                  </div>
                  <div class="form-row">
                    <div class="form-group"><label for="lead-source">Lead Source</label>
                      <select id="lead-source" name="source">
                        <option value="Home Show">Home Show</option>
                        <option value="Facebook">Facebook</option>
                        <option value="Referral">Referral</option>
                        <option value="Website">Website</option>
                        <option value="Walk-in">Walk-in</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                  </div>
                  <div class="form-group"><label for="lead-notes">Note</label><textarea id="lead-notes" name="notes" placeholder="Any details about the roof..."></textarea></div>
                  <button type="submit" class="btn btn-primary btn-lg">💾 Save Lead</button>
                </div>
              </form>
            </div>

            <!-- PAGE: SUCCESS -->
            <div id="page-success" class="page" aria-hidden="true">
              <div class="success-page">
                <div class="icon">✅</div>
                <h2>Lead Saved!</h2>
                <p><strong id="succ-name"></strong> is in the system.</p>
                <div class="action-btns" style="justify-content:center;">
                  <button class="btn btn-outline" onclick="showPage('detail', currentLeadId)">📐 Enter Roof Sq Ft</button>
                  <button class="btn btn-secondary" onclick="showPage('capture')">➕ New Lead</button>
                </div>
              </div>
            </div>

            <!-- PAGE: DASHBOARD -->
            <div id="page-dashboard" class="page" aria-hidden="true">
              <div class="card">
                <div class="card-title">📋 Leads Dashboard</div>
                <div class="export-bar">
                  <button class="btn btn-secondary" onclick="exportJSON()">⬇️ Export JSON</button>
                  <button class="btn btn-secondary" onclick="exportCSV()">⬇️ Export CSV</button>
                  <a href="https://fixr.com/cost-guide/shingle-roof-replacement" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="text-decoration:none;text-align:center;">🧮 fixr.com</a>
                </div>
                <input type="text" id="lead-search" class="search-box" placeholder="Search by name, phone, address..." oninput="renderDashboard()">
              </div>
              <div id="lead-list"></div>
            </div>

            <!-- PAGE: DETAIL -->
            <div id="page-detail" class="page" aria-hidden="true">
              <button class="btn btn-secondary" style="width:auto;margin-bottom:1rem;" onclick="showPage('dashboard')">← Back to Leads</button>
              <div id="detail-content"></div>

              <div class="card">
                <div class="card-title">📐 Roof Quote Calculator</div>

                <!-- Mode toggle -->
                <div class="form-group">
                  <label>How do you know your house size?</label>
                  <div class="action-btns mode-btns" style="margin-bottom:0;">
                    <button type="button" class="btn btn-secondary active" id="mode-dims" onclick="setCalcMode('dims')">📏 Length & Width</button>
                    <button type="button" class="btn btn-secondary" id="mode-living" onclick="setCalcMode('living')">🏠 Living Area</button>
                    <button type="button" class="btn btn-secondary" id="mode-roofsqt" onclick="setCalcMode('roofsqt')">📐 Roof Sq Ft</button>
                  </div>
                </div>

                <!-- Dimensions mode -->
                <div id="calc-dims" style="display:none;">
                  <div class="form-row">
                    <div class="form-group"><label for="calc-length">House Length (ft)</label><input type="number" id="calc-length" placeholder="e.g. 50" min="10"></div>
                    <div class="form-group"><label for="calc-width">House Width (ft)</label><input type="number" id="calc-width" placeholder="e.g. 30" min="10"></div>
                  </div>
                </div>

                <!-- Living area mode -->
                <div id="calc-living" style="display:none;">
                  <div class="form-row">
                    <div class="form-group"><label for="calc-living-sqft">Living Area (sq ft)</label><input type="number" id="calc-living-sqft" placeholder="e.g. 1800" min="100"></div>
                    <div class="form-group"><label for="calc-stories">Stories</label>
                      <select id="calc-stories">
                        <option value="1">1 story</option>
                        <option value="2">2 stories</option>
                        <option value="3">3 stories</option>
                      </select>
                    </div>
                  </div>
                </div>

                <!-- Roof sq ft mode (from fixr.com) -->
                <div id="calc-roofsqt" style="display:none;">
                  <div class="form-row">
                    <div class="form-group"><label for="calc-roof-sqft">Roof Sq Ft (from fixr.com)</label><input type="number" id="calc-roof-sqft" placeholder="e.g. 2400" min="100"></div>
                  </div>
                </div>

                <!-- Common fields -->
                <div id="calc-common" style="display:none;">
                  <div class="form-group">
                    <label>Roof Pitch</label>
                    <div class="pitch-selector">
                      <button type="button" class="pitch-btn" data-pitch="1.05" onclick="selectPitch(this)">
                        <span class="pitch-icon">▬</span>
                        <span>Flat / Low</span>
                      </button>
                      <button type="button" class="pitch-btn active" data-pitch="1.15" onclick="selectPitch(this)">
                        <span class="pitch-icon">/</span>
                        <span>Medium</span>
                      </button>
                      <button type="button" class="pitch-btn" data-pitch="1.25" onclick="selectPitch(this)">
                        <span class="pitch-icon">/|</span>
                        <span>Steep</span>
                      </button>
                      <button type="button" class="pitch-btn" data-pitch="1.35" onclick="selectPitch(this)">
                        <span class="pitch-icon">/||</span>
                        <span>Very Steep</span>
                      </button>
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group"><label for="calc-garage">Garage</label>
                      <select id="calc-garage">
                        <option value="0">No garage</option>
                        <option value="240">1-car garage (+240 sq ft)</option>
                        <option value="480">2-car garage (+480 sq ft)</option>
                        <option value="720">3-car garage (+720 sq ft)</option>
                      </select>
                    </div>
                    <div class="form-group"><label for="calc-overhang">Overhang</label>
                      <select id="calc-overhang">
                        <option value="1.0">None</option>
                        <option value="1.10" selected>Standard (+10%)</option>
                        <option value="1.20">Large (+20%)</option>
                      </select>
                    </div>
                  </div>

                </div>

                <button type="button" class="btn btn-primary btn-lg" onclick="calculateRoof()" style="margin-top:1rem;">🧮 Calculate Roof & Quote</button>

                <!-- Discount -->
                <div class="form-group" style="margin-top:1rem;">
                  <label>Discount</label>
                  <div class="action-btns mode-btns" style="margin-bottom:0;">
                    <button type="button" class="discount-btn active" id="disc-none" onclick="selectDiscount(0, this)">No discount</button>
                    <button type="button" class="discount-btn" id="disc-15" onclick="selectDiscount(0.15, this)">15% off</button>
                    <button type="button" class="discount-btn" id="disc-20" onclick="selectDiscount(0.20, this)">20% off</button>
                  </div>
                </div>

                <!-- Results -->
                <div id="calc-result" style="display:none; margin-top:1rem;"></div>
              </div>

              <div class="card">
                <div class="card-title">📌 Update Status</div>
                <div class="action-btns">
                  <button class="btn btn-secondary" onclick="onUpdateStatus('New')">🆕 New</button>
                  <button class="btn btn-secondary" onclick="onUpdateStatus('Contacted')">📞 Contacted</button>
                  <button class="btn btn-success" onclick="onUpdateStatus('Quoted')">💰 Quoted</button>
                  <button class="btn btn-warning" onclick="onUpdateStatus('Follow-up')">🔔 Follow-up</button>
                  <button class="btn btn-outline" onclick="onUpdateStatus('Closed Won')">🎉 Closed Won</button>
                  <button class="btn btn-danger-outline" onclick="onUpdateStatus('Closed Lost')">❌ Closed Lost</button>
                </div>
              </div>
            </div>
          </main>
        `;
        document.getElementById('root').innerHTML = html;
        setCalcMode('dims');
        selectDiscount(0, document.getElementById('disc-none'));
        updateBadge();

        const form = document.getElementById('lead-form');
        if (form) {
          form.addEventListener('input', () => { formDirty = true; });
          window.addEventListener('beforeunload', (e) => {
            if (formDirty && currentPage === 'capture') {
              e.preventDefault();
              e.returnValue = '';
            }
          });
        }
      }

      init();
    </script>
  </body>
</html>
